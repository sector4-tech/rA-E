###########################################################################
# Party Bonus Database
###########################################################################
#
# Every member of a party receives the bonus of the tier that matches the number of
# ELIGIBLE members (see conf/battle/party.conf: party_bonus_same_map / party_bonus_exclude_idle).
# The more members, the bigger the bonus - it is given to EVERYONE in the party.
#
# Tier Settings
###########################################################################
# - Id                        Tier id (1 or higher). Lowest id wins when ranges overlap.
#                             Tier ids 1~5 also show the icons EFST_PARTYEXP_LV1 ~ EFST_PARTYEXP_LV5.
#   Name                      Name displayed to the players. (Default: "Tier <Id>")
#   MinMembers                Minimum eligible members for this tier. (2 ~ MAX_PARTY)
#   MaxMembers                Maximum eligible members for this tier. (2 ~ MAX_PARTY)
#   BaseExp                   Base EXP bonus in %, from monsters. (Default: 0)
#   JobExp                    Job EXP bonus in %, from monsters. (Default: 0)
#   Drop                      Item drop rate bonus in % (additive with other drop bonuses). (Default: 0)
#   MaxHp                     MaxHP bonus in %. (Default: 0)
#   MaxSp                     MaxSP bonus in %. (Default: 0)
###########################################################################

Header:
  Type: PARTY_BONUS_DB
  Version: 1

Body:
